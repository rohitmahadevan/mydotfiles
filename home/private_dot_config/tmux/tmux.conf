# General
set -g mouse on
set -g history-limit 50000
set -g base-index 1
setw -g pane-base-index 1
set -g renumber-windows on
set -sg escape-time 10
set -g focus-events on

# True color
set -g default-terminal "tmux-256color"
set -as terminal-features ",xterm-256color:RGB"

# Keep the current directory for new splits and windows
bind '"' split-window -v -c "#{pane_current_path}"
bind % split-window -h -c "#{pane_current_path}"
bind c new-window -c "#{pane_current_path}"

# prefix + r reloads this file
bind r source-file ~/.config/tmux/tmux.conf \; display "Config reloaded"

# Catppuccin Mocha
set -g status-style "bg=#181825,fg=#cdd6f4"
set -g status-left-length 30
set -g status-left "#[bg=#89b4fa,fg=#11111b,bold] #S #[default] "
set -g status-right "#[fg=#a6adc8]%Y-%m-%d %H:%M "
setw -g window-status-format " #I:#W "
setw -g window-status-current-format "#[bg=#cba6f7,fg=#11111b,bold] #I:#W "
set -g pane-border-style "fg=#313244"
set -g pane-active-border-style "fg=#89b4fa"
set -g message-style "bg=#313244,fg=#cdd6f4"
setw -g mode-style "bg=#45475a,fg=#cdd6f4"
